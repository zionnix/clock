<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Clock - Horloge Intelligente</title>
    <link href="https://fonts.cdnfonts.com/css/spaceline" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="smart-clock">
        <header class="header">
            <h1 class="title" id="pageTitle">HEURE DANS LA VILLE DE CHARGEMENT...</h1>
        </header>

        <main class="main-content">
            <div class="left-section">
                <div class="temperature-circle">
                    <span class="temp-value" id="temperature">--°</span>
                </div>
                <div class="city-name" id="cityName">Chargement...</div>
                <button class="change-city-btn" id="changeCityBtn">Changer de ville</button>
                <form class="city-input-form" id="cityForm">
                    <div class="city-input-row">
                        <div class="city-input-wrapper">
                            <input type="text" class="city-input" id="cityInput" placeholder="Nom de la ville" autocomplete="off">
                            <div class="autocomplete-list" id="autocompleteList"></div>
                        </div>
                        <button type="submit" class="submit-btn">OK</button>
                    </div>
                </form>
                <button class="reset-location-btn" id="resetLocationBtn">📍 Ma position</button>
            </div>

            <div class="center-section">
                <div class="clock-container">
                    <svg class="clock-svg" viewBox="0 0 200 200">
                        <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(100, 100, 100, 0.2)" stroke-width="8"/>
                        <circle id="hoursArc" cx="100" cy="100" r="85" fill="none" stroke="#00A8FF" stroke-width="8" 
                                stroke-dasharray="0 534.07" stroke-linecap="round" transform="rotate(-90 100 100)" class="arc-animation"/>
                        
                        <circle cx="100" cy="100" r="70" fill="none" stroke="rgba(100, 100, 100, 0.2)" stroke-width="8"/>
                        <circle id="minutesArc" cx="100" cy="100" r="70" fill="none" stroke="#00FF87" stroke-width="8" 
                                stroke-dasharray="0 439.82" stroke-linecap="round" transform="rotate(-90 100 100)" class="arc-animation"/>
                        
                        <circle cx="100" cy="100" r="55" fill="none" stroke="rgba(100, 100, 100, 0.2)" stroke-width="8"/>
                        <circle id="secondsArc" cx="100" cy="100" r="55" fill="none" stroke="#FF3366" stroke-width="8" 
                                stroke-dasharray="0 345.58" stroke-linecap="round" transform="rotate(-90 100 100)" class="arc-animation"/>
                    </svg>

                    <div class="time-display">
                        <div class="time-numbers">
                            <span class="hours" id="hours">00</span>
                            <span class="separator">:</span>
                            <span class="minutes" id="minutes">00</span>
                            <span class="separator">:</span>
                            <span class="seconds" id="seconds">00</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="right-section">
                <div class="date-display">
                    <span class="day" id="dateDay">1</span>
                    <span class="month" id="dateMonth">janvier</span>
                    <span class="year" id="dateYear">2024</span>
                </div>
                <div class="week-display" id="weekDisplay"></div>
            </div>
        </main>

        <footer class="footer">
            <p>Police "Spaceline" de <a href="https://fontmeme.com" target="_blank" rel="noopener noreferrer">FontMeme.com</a></p>
            <p class="creator">
                Créé par [Votre Nom] | 
                <a href="#" class="footer-link">Projet 1</a> | 
                <a href="#" class="footer-link">Projet 2</a>
            </p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
